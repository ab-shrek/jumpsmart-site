<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JumpSmart — TerribleToe Productions</title>
  <style>
    :root {
      --navy: #0d1118;
      --mint: #7dffc3;
      --text: #e8eef5;
      --muted: #9aa7b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--navy);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }
    h1 { font-size: 2rem; letter-spacing: 0.04em; margin: 0 0 0.25rem; }
    h1 span { color: var(--mint); }
    .sub { color: var(--muted); margin: 0 0 2rem; }
    a { color: var(--mint); }
    p { margin: 0 0 1rem; }
    ul { padding-left: 1.2rem; color: var(--muted); }
    footer { margin-top: 3rem; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>JUMP<span>SMART</span></h1>
    <p class="sub">A 1v1 online duel from TerribleToe Productions.</p>
    <p>Place bombs, race for coins, and outsmart your rival before time runs out.</p>
    <p>
      <a href="https://apps.apple.com/app/id6758254482">App Store</a>
      ·
      <a href="privacy.html">Privacy Policy</a>
      ·
      <a href="support.html">Support</a>
    </p>
    <footer>© 2026 TerribleToe Productions</footer>

</body>
</html>
